schema_version: "1.0"
workflow:
  id: run-tickets
  name: Run Tickets
  version: "1.0.0"
  author: "devcxl"
  description: "长时运行票（真实运行类）的串行派发与凭证 jev 审查"
inputs:
  repo_root:
    type: string
    required: true
    prompt: "主检出仓库绝对路径"
  integration_branch:
    type: string
    required: true
    prompt: "集成分支名"
  spec_goal_file:
    type: string
    required: true
    prompt: "整体目标文本文件的绝对路径"
  frontier_label:
    type: string
    default: "run"
    prompt: "运行票的 issue label"
  max_fix_rounds:
    type: number
    default: 2
    prompt: "jev 审查不过时的自动修复轮数上限"
steps:
  - id: preflight
    type: shell
    run: >-
      test -d '{{ inputs.repo_root }}' && git -C '{{ inputs.repo_root }}' rev-parse --verify
      '{{ inputs.integration_branch }}' && test -f '{{ inputs.spec_goal_file }}' && command -v acpx
      >/dev/null && command -v jev-decide >/dev/null && command -v gh >/dev/null && echo preflight-ok
  - id: ticket-loop
    type: do-while
    condition: "{{ steps.scan.output.stdout | from_json | length }}"
    max_iterations: 200
    steps:
      - id: scan
        type: shell
        run: >-
          bash '{{ context.workflow_dir }}/../scripts/frontier.sh' '{{ inputs.repo_root }}'
          '{{ inputs.frontier_label }}'
      - id: has-tickets
        type: if
        condition: "{{ steps.scan.output.stdout | from_json | length }}"
        then:
          - id: work
            type: fan-out
            items: "{{ steps.scan.output.stdout | from_json }}"
            # 运行票串行（模板约定：不与其他运行票并发）；引擎不解析本字段的表达式
            max_concurrency: 1
            step:
              id: ticket
              type: shell
              timeout: 86400
              run: >-
                bash '{{ context.workflow_dir }}/../scripts/ticket-lifecycle.sh' --repo
                '{{ inputs.repo_root }}' --branch '{{ inputs.integration_branch }}' --ticket
                '{{ item }}' --type run --goal-file '{{ inputs.spec_goal_file }}'
                --skill-dir '{{ context.workflow_dir }}/..' --max-rounds
                '{{ inputs.max_fix_rounds }}' --agents '{{ inputs.agents }}'
          - id: collect
            type: fan-in
            wait_for: [work]
  - id: assert-drained
    type: shell
    run: >-
      n='{{ steps.scan.output.stdout | from_json | length }}'; test "$n" = '0' || { echo
      "前沿未排空：$n 张票因循环上限滞留" >&2; exit 1; }
