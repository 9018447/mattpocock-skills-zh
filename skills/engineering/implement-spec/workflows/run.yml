schema_version: "1.0"
workflow:
  id: run-tickets
  name: Run Tickets
  version: "1.1.0"
  author: "devcxl"
  description: "长时运行票（真实运行类）的串行派发与凭证 jev 审查；编排者显式给定本地票清单，引擎不扫描票库"
inputs:
  repo_root:
    type: string
    required: true
    prompt: "主检出仓库绝对路径"
  integration_branch:
    type: string
    required: true
    prompt: "集成分支名"
  spec_goal_file:
    type: string
    required: true
    prompt: "整体目标文本文件的绝对路径"
  ticket_files:
    type: string
    required: true
    prompt: "本波运行票的本地文件路径 JSON 数组（编排者显式给定，串行执行）"
  agents:
    type: string
    default: "codex"
    prompt: "派发降级链（空格分隔短名 omp-acp/kimi/dsh/codex 或 ACP 桥路径）"
  max_fix_rounds:
    type: number
    default: 2
    prompt: "jev 审查不过时的自动修复轮数上限"
steps:
  - id: preflight
    type: shell
    run: >-
      test -d '{{ inputs.repo_root }}' && git -C '{{ inputs.repo_root }}' rev-parse --verify
      '{{ inputs.integration_branch }}' && test -f '{{ inputs.spec_goal_file }}' && command -v acpx
      >/dev/null && command -v jev-decide >/dev/null && echo '{{ inputs.ticket_files }}' | python3 -c
      'import json,sys,os; [sys.exit("票文件不存在: "+p) for p in json.load(sys.stdin) if not os.path.isfile(p)]'
      && echo preflight-ok
  - id: work
    type: fan-out
    items: "{{ inputs.ticket_files | from_json }}"
    # 运行票串行（模板约定：不与其他运行票并发）；引擎不解析本字段的表达式
    max_concurrency: 1
    step:
      id: ticket
      type: shell
      timeout: 86400
      run: >-
        bash '{{ context.workflow_dir }}/../scripts/ticket-lifecycle.sh' --repo
        '{{ inputs.repo_root }}' --branch '{{ inputs.integration_branch }}' --ticket-file
        '{{ item }}' --type run --goal-file '{{ inputs.spec_goal_file }}'
        --skill-dir '{{ context.workflow_dir }}/..' --max-rounds
        '{{ inputs.max_fix_rounds }}' --agents '{{ inputs.agents }}'
  - id: collect
    type: fan-in
    wait_for: [work]
